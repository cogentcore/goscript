<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="darkreader-lock" />
    <title>Playground - GoScript</title>
    <meta
      name="description"
      content="GoScript playground - explore Go to TypeScript examples and run them in your browser."
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <header class="header">
      <div class="container header-content">
        <a href="../" class="lockup" aria-label="GoScript home">
          <svg class="logo-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 2.5 20.5 7.25v9.5L12 21.5l-8.5-4.75v-9.5Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
            <path
              d="m9.5 9-3 3 3 3m5-6 3 3-3 3"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          GoScript
          <span class="lockup-page">Playground</span>
        </a>
        <nav class="nav" aria-label="Site">
          <a href="../" class="nav-link wide">Home</a>
          <a href="../tests/" class="nav-link">Tests</a>
          <a href="https://github.com/s4wave/goscript" class="nav-link"
            >GitHub</a
          >
        </nav>
      </div>
    </header>

    <main class="app-layout">
      <div class="toolbar">
        <select id="example-select" class="select-input" aria-label="Example">
          <option value="">Load an example</option>
        </select>
        <div class="spacer"></div>
        <span id="compiler-status" class="status">Loading the compiler</span>
        <button id="share-btn" class="btn btn-sm">Share</button>
        <button id="compile-btn" class="btn btn-sm" disabled>Compile</button>
        <button id="run-btn" class="btn btn-primary btn-sm" disabled>
          Run
        </button>
      </div>

      <div class="editor-grid">
        <div class="panel">
          <div class="panel-header">
            <span class="go">Go input</span>
            <span class="code-filename" id="go-filename">main.go</span>
          </div>
          <div id="go-editor" class="panel-body monaco-container"></div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <span class="ts">TypeScript output</span>
            <span class="code-filename" id="ts-filename">main.gs.ts</span>
          </div>
          <div id="ts-editor" class="panel-body monaco-container"></div>
        </div>
      </div>

      <div class="panel console">
        <div class="panel-header">
          <span>Console</span>
          <button id="clear-btn" class="btn btn-sm">Clear</button>
        </div>
        <pre id="output-body" class="panel-body output-panel">
Pick an example or write some Go to get started.</pre
        >
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/esbuild-wasm@0.27.2/lib/browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
    <script>
      require.config({
        paths: {
          vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs',
        },
      })
      window.MonacoEnvironment = { getWorkerUrl: () => proxy }
      let proxy = URL.createObjectURL(
        new Blob(
          [
            `
        self.MonacoEnvironment = { baseUrl: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/' };
        importScripts('https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/base/worker/workerMain.js');
      `,
          ],
          { type: 'text/javascript' },
        ),
      )
      require(['vs/editor/editor.main'], function () {
        window.monacoReady = true
        window.dispatchEvent(new Event('monaco-ready'))
      })
    </script>
    <script src="../assets/js/playground.js" type="module"></script>
  </body>
</html>
