<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="darkreader-lock" />
    <title>Compliance Tests - GoScript</title>
    <meta
      name="description"
      content="Browse GoScript compliance tests - see how Go code is translated to TypeScript."
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <header class="header">
      <div class="container header-content">
        <a href="../" class="lockup" aria-label="GoScript home">
          <svg class="logo-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 2.5 20.5 7.25v9.5L12 21.5l-8.5-4.75v-9.5Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
            <path
              d="m9.5 9-3 3 3 3m5-6 3 3-3 3"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          GoScript
          <span class="lockup-page">Tests</span>
        </a>
        <nav class="nav" aria-label="Site">
          <a href="../" class="nav-link wide">Home</a>
          <a href="../playground/" class="nav-link">Playground</a>
          <a href="https://github.com/s4wave/goscript" class="nav-link"
            >GitHub</a
          >
        </nav>
      </div>
    </header>

    <main class="tests-layout">
      <div class="sidebar">
        <div class="panel-header">
          <span>Compliance tests</span>
          <span id="test-count" class="code-filename"></span>
        </div>
        <div class="sidebar-section">
          <input
            type="text"
            id="test-search"
            class="search-input"
            placeholder="Filter tests"
            aria-label="Filter tests"
          />
          <div class="sidebar-row">
            <button id="run-all-btn" class="btn btn-sm">Run all</button>
            <button id="stop-btn" class="btn btn-sm" hidden>Stop</button>
          </div>
        </div>
        <div id="stats-bar" class="sidebar-status" hidden>
          <span id="stats-passed" class="passed">0 passed</span> ·
          <span id="stats-failed" class="failed">0 failed</span> ·
          <span id="stats-skipped">0 skipped</span>
        </div>
        <div id="compiler-status" class="sidebar-status">
          <span id="compiler-status-text">Loading the TypeScript compiler</span>
        </div>
        <div id="progress-bar" hidden><div id="progress-fill"></div></div>
        <div id="test-list" class="test-list">
          <div class="loading">Loading tests</div>
        </div>
      </div>

      <div class="workbench-main">
        <div class="test-bar">
          <span id="test-name">Select a test</span>
          <button id="compile-btn" class="btn btn-sm" disabled>Compile</button>
          <button id="run-btn" class="btn btn-primary btn-sm" disabled>
            Run
          </button>
        </div>

        <div class="editor-grid">
          <div class="panel">
            <div class="panel-header"><span class="go">Go source</span></div>
            <div id="go-editor" class="panel-body monaco-container"></div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <span class="ts">TypeScript output</span>
            </div>
            <div id="ts-editor" class="panel-body monaco-container"></div>
          </div>
        </div>

        <div class="editor-grid outputs">
          <div class="panel">
            <div class="panel-header"><span>Expected output</span></div>
            <pre id="expected-output" class="panel-body output-panel"></pre>
          </div>

          <div class="panel">
            <div class="panel-header"><span>Actual output</span></div>
            <pre id="actual-output" class="panel-body output-panel">
Run the test to see its output.</pre
            >
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/esbuild-wasm@0.27.2/lib/browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
    <script>
      require.config({
        paths: {
          vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs',
        },
      })
      window.MonacoEnvironment = { getWorkerUrl: () => proxy }
      let proxy = URL.createObjectURL(
        new Blob(
          [
            `
        self.MonacoEnvironment = { baseUrl: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/' };
        importScripts('https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/base/worker/workerMain.js');
      `,
          ],
          { type: 'text/javascript' },
        ),
      )
      require(['vs/editor/editor.main'], function () {
        window.monacoReady = true
        window.dispatchEvent(new Event('monaco-ready'))
      })
    </script>
    <script src="../assets/js/tests.js" type="module"></script>
  </body>
</html>
